run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - gofmt
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - whyNoLint
      - hugeParam
      - rangeValCopy
  revive:
    rules:
      - name: exported
        disabled: false
      - name: unexported-return
        disabled: false
      - name: indent-error-flow
        disabled: false

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
